<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediaHost</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="logo">MEDIAHOST</div>

    <label class="upload-btn">
        Upload
        <input type="file" id="uploadInput" hidden>
    </label>
</header>

<section class="hero">
    <h1>Family Media Library</h1>
    <p>Private streaming for movies, memories, and home videos.</p>
</section>

<section class="section">
    <h2>Recently Added</h2>
    <div id="grid" class="grid"></div>
</section>

<div id="overlay" class="overlay hidden">

    <div class="player-shell">

        <div class="player-topbar">
            <div id="videoTitle" class="video-title">Now Playing</div>

            <button id="closeBtn" class="icon-btn">
                ✕
            </button>
        </div>

        <div class="video-container">

            <video id="videoPlayer"></video>

            <div class="controls">

                <button id="playBtn" class="control-btn">▶</button>

                <button id="backBtn" class="control-btn">« 10</button>

                <button id="forwardBtn" class="control-btn">10 »</button>

                <input type="range" id="seekBar" value="0">

                <select id="qualitySelect">
                    <option>Auto</option>
                    <option>1080p</option>
                    <option>720p</option>
                    <option>480p</option>
                </select>

                <button id="captionBtn" class="control-btn">
                    CC
                </button>

                <button id="fullscreenBtn" class="control-btn">
                    ⛶
                </button>

            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
